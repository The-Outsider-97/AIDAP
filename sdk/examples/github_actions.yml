# Block a pipeline when a knowledge-base export is not fit for RAG indexing.
name: validate-knowledge-base
on: [push]
jobs:
  aidap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ./sdk            # or vendor aidap_sdk
      - run: python -m aidap_sdk check export/handbook.json --project "$AIDAP_PROJECT" --profile rag_indexing
        env:
          AIDAP_URL: https://aidap.example.com
          AIDAP_API_KEY: ${{ secrets.AIDAP_API_KEY }}
          AIDAP_PROJECT: prj_xxx
